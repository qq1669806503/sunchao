<style>

.dish-del:hover{background:#ffd9de;color:#d6455a;transform:scale(1.08)}

.input{width:100%;padding:13px 15px;border-radius:15px;border:2px solid var(--primary-soft);background:var(--card);font-family:inherit;font-size:16px;color:var(--text);outline:none;transition:.2s;-webkit-appearance:none;appearance:none}

.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.switch{width:56px;height:32px;border-radius:999px;border:none;background:var(--primary-soft);position:relative;cursor:pointer;padding:0;transition:.25s}
.switch span{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:.25s}
.switch.on{background:var(--primary)}
.switch.on span{left:27px}

.upload-box{position:relative;border:2px dashed var(--primary-soft);border-radius:16px;background:var(--card);min-height:96px;display:grid;place-items:center;cursor:pointer;overflow:hidden;transition:.2s}
.upload-box:active{transform:scale(.985)}

.upload-box img.up-img{width:100%;max-height:190px;object-fit:cover;display:block;-webkit-touch-callout:none;user-select:none;-webkit-user-drag:none}
.upload-box .rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:999px;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:2}

.cart-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1.5px dashed var(--primary-soft)}
.cart-item:last-child{border-bottom:none}
.ci-emoji{font-size:24px;flex:0 0 auto;line-height:1}
.ci-thumb{width:38px;height:38px;border-radius:11px;object-fit:cover;display:block;background:var(--primary-soft);cursor:zoom-in;transition:transform .15s;-webkit-touch-callout:none;user-select:none;-webkit-user-drag:none}
.ci-thumb:active{transform:scale(.92)}
.ci-main{flex:1;min-width:0}
.ci-name{font-size:14px;font-weight:700;line-height:1.35}

.stepper{display:flex;align-items:center;gap:9px;flex:0 0 auto}

.stepper button:active{transform:scale(.85)}
.stepper span{min-width:18px;text-align:center;font-size:14px;font-weight:800}

.order-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:2px solid var(--primary-soft);box-shadow:0 4px 16px rgba(0,0,0,.05);animation:slideUp .35s cubic-bezier(.34,1.4,.64,1)}

.oc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}

.empty-big{text-align:center;padding:60px 20px;color:var(--muted)}

.hist-card{background:var(--card);border-radius:var(--radius);padding:15px 16px;margin-bottom:12px;border:2px solid var(--primary-soft);box-shadow:0 3px 12px rgba(0,0,0,.04);transition:opacity .25s,transform .25s}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
function rgbToHex(r,g,b){const h=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');return'#'+h(r)+h(g)+h(b)}
function mix(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(A.r+(B.r-A.r)*t,A.g+(B.g-A.g)*t,A.b+(B.b-A.b)*t)}
const lighten=(c,t)=>mix(c,'#ffffff',t), darken=(c,t)=>mix(c,'#000000',t);
const rgba=(h,a)=>{const{r,g,b}=hexToRgb(h);return`rgba(${r},${g},${b},${a})`};
const lum=h=>{const{r,g,b}=hexToRgb(h);return(0.299*r+0.587*g+0.114*b)/255};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtTime(ts){const d=new Date(ts),p=n=>String(n).padStart(2,'0');return`${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`}

function applyTheme(){
  const t=store.theme,r=document.documentElement,dark=lum(t.bg)<0.5;
  const ink=dark?lighten(t.primary,.32):darken(t.primary,.18);
  const soft=mix(t.primary,t.bg,.84);
  const muted=mix(t.text,t.bg,.42);
  r.style.setProperty('--primary',t.primary);
  r.style.setProperty('--primary-ink',ink);
  r.style.setProperty('--primary-soft',soft);
  r.style.setProperty('--accent',t.accent);
  r.style.setProperty('--bg',t.bg);
  r.style.setProperty('--card',t.card);
  r.style.setProperty('--text',t.text);
  r.style.setProperty('--muted',muted);
  r.style.setProperty('--radius',t.radius+'px');
  r.style.setProperty('--font',FONTS[t.font]||FONTS.round);
  r.style.setProperty('--dot',rgba(t.primary,dark?.20:.28));
  r.style.setProperty('--shadow',`0 ${Math.round(8*t.shadow)}px ${Math.round(20*t.shadow)}px rgba(0,0,0,${(dark?.34:.10)*t.shadow})`);
  const bgLayer=$('#bgPhoto'),bgImg=t.bgImg||'',bgOp=bgImg?((t.bgImgOpacity==null?100:t.bgImgOpacity)/100):0;
  if(bgLayer)bgLayer.style.backgroundImage=bgImg?`url("${bgImg}")`:'none';
  r.style.setProperty('--bg-img-opacity',bgOp);
  document.body.classList.toggle('no-deco',!t.deco);
  document.body.classList.toggle('dark',dark);
  document.body.classList.toggle('has-bg-photo',!!bgImg);
  const meta=document.querySelector('meta[name=theme-color]')||(()=>{const m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m);return m})();
  meta.content=t.bg;
}

function fileToCompressedDataURL(file,maxSize=480,quality=0.75){
  return new Promise((resolve,reject)=>{
    if(!file||!/^image\//.test(file.type))return reject(new Error('not image'));
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h)return reject(new Error('bad image'));
        if(w>h&&w>maxSize){h=Math.round(h*maxSize/w);w=maxSize}
        else if(h>=w&&h>maxSize){w=Math.round(w*maxSize/h);h=maxSize}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        try{resolve(cv.toDataURL('image/jpeg',quality))}catch(e){reject(e)}
      };
      img.onerror=()=>reject(new Error('load error'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}

}
function confirmDeleteDish(id){
  const d=getDish(id);if(!d)return false;
  if(!confirm(`确定从菜单中删除「${d.name}」吗？`))return false;
  store.dishes=store.dishes.filter(x=>x.id!==id);
  store.cart=store.cart.filter(c=>c.id!==id);
  if(editingId===id)editingId=null;
  save();renderDishes();renderCartBar();renderCartSheet();toast('菜品已删除 🗑');return true;
}
function submitOrder(){
  if(!store.cart.length)return;
  const items=store.cart.map(c=>{const d=getDish(c.id);return{name:d.name,emoji:d.emoji,img:d.img||null,count:c.count,note:(c.note||'').trim()}});
  store.orders.unshift({id:Date.now(),createdAt:Date.now(),items,checks:items.map(()=>false),done:false,doneAt:null});
  store.cart=[];save();closeAllPanels();renderAll();switchView('kitchen');toast('点好啦，等开饭 🍚');
}
function toggleCheck(oid,idx){const o=store.orders.find(x=>x.id===Number(oid));if(!o)return;o.checks[idx]=!o.checks[idx];save();renderKitchen()}
function finishOrder(oid){const o=store.orders.find(x=>x.id===Number(oid));if(!o)return;o.done=true;o.doneAt=Date.now();save();renderKitchen();renderHistory();toast('开饭啦，辛苦了 ❤️')}
function deleteHistory(oid){
  const id=Number(oid),o=store.orders.find(x=>x.id===id);if(!o)return;
  const preview=o.items.slice(0,3).map(i=>i.name).join('、')+(o.items.length>3?` 等${o.items.length}道`:'');
  if(!confirm(`确定删除这条记录吗？\n${fmtTime(o.createdAt)} · ${preview}`))return;
  const card=document.querySelector(`.hist-card[data-card="${id}"]`);
  if(card){card.style.opacity='0';card.style.transform='translateX(24px)'}
  setTimeout(()=>{store.orders=store.orders.filter(x=>x.id!==id);save();renderHistory();toast('记录已删除 🗑')},220);
}

function renderThemePanel(){
  const t=store.theme,bg=t.bgImg||'',bgOp=t.bgImgOpacity==null?100:t.bgImgOpacity;
  $('#themeBody').innerHTML=`
    <div class="drawer-head"><h3>🎨 换装间</h3><button class="icon-btn small" id="closeTheme">✕</button></div>
    <div class="row"><label>主题预设</label><div class="preset-grid">
      ${PRESETS.map(p=>`<button class="preset ${t.preset===p.id?'on':''}" data-preset="${p.id}"><span class="swatch" style="background:linear-gradient(135deg,${p.primary},${p.accent})"></span><span>${p.name}</span></button>`).join('')}
    </div></div>
    <div class="row"><label>主色调</label><input type="color" id="cPrimary" value="${t.primary}" style="width:100%;height:44px;border:2px solid var(--primary-soft);border-radius:15px;background:var(--card);padding:4px;cursor:pointer"></div>
    <div class="row"><label>背景色</label><input type="color" id="cBg" value="${t.bg}" style="width:100%;height:44px;border:2px solid var(--primary-soft);border-radius:15px;background:var(--card);padding:4px;cursor:pointer"></div>
    <div class="row"><label>卡片色</label><input type="color" id="cCard" value="${t.card}" style="width:100%;height:44px;border:2px solid var(--primary-soft);border-radius:15px;background:var(--card);padding:4px;cursor:pointer"></div>
    <div class="row"><label>文字色</label><input type="color" id="cText" value="${t.text}" style="width:100%;height:44px;border:2px solid var(--primary-soft);border-radius:15px;background:var(--card);padding:4px;cursor:pointer"></div>
    <div class="row"><label>背景照片 <span style="opacity:.65;font-weight:600">（可选）</span></label>
      <div class="upload-box" id="bgUploadBox">
        ${bg?`<img class="up-img" src="${bg}" alt=""><button class="rm" data-rm-bg>✕</button>`:`<div class="ph">🖼️ 点击上传背景照片<small>可选 · 会铺满整个页面</small></div>`}
        <input type="file" id="bgImgInput" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
      </div>
    </div>
    <div class="row"><label>背景透明度 <b id="bgOpVal">${bgOp}%</b></label><input type="range" id="rBgOp" min="0" max="100" value="${bgOp}"></div>
    <div class="row"><label>圆角大小 <b id="radVal">${t.radius}px</b></label><input type="range" id="rRadius" min="0" max="36" value="${t.radius}"></div>
    <div class="row"><label>阴影强度 <b id="shVal">${t.shadow.toFixed(1)}</b></label><input type="range" id="rShadow" min="0" max="2" step="0.1" value="${t.shadow}"></div>
    <div class="row"><label>字体风格</label><div class="seg" id="fontSeg">${Object.keys(FONTS).map(k=>`<button data-font="${k}" class="${t.font===k?'on':''}">${FONT_NAMES[k]}</button>`).join('')}</div></div>
    <div class="row" style="display:flex;align-items:center;justify-content:space-between"><label style="margin:0">波点背景装饰</label><button class="switch ${t.deco?'on':''}" id="swDeco"><span></span></button></div>
    <button class="btn-ghost" id="resetTheme">恢复默认（可爱风）</button>
    <p class="tip">设置会自动保存在本机哦～</p>
  `;
  bindThemeEvents();
}
function bindThemeEvents(){
  $$('#themeBody [data-preset]').forEach(btn=>{btn.onclick=()=>{const p=PRESETS.find(x=>x.id===btn.dataset.preset);Object.assign(store.theme,{preset:p.id,primary:p.primary,accent:p.accent,bg:p.bg,card:p.card,text:p.text});applyTheme();save();renderThemePanel();toast('已换上「'+p.name+'」✨')}});
  const bindColor=(sel,key)=>{const el=$(sel);if(!el)return;el.addEventListener('input',e=>{store.theme[key]=e.target.value;store.theme.preset='';applyTheme();save()})};
  bindColor('#cPrimary','primary');bindColor('#cBg','bg');bindColor('#cCard','card');bindColor('#cText','text');
  const bgBox=$('#bgUploadBox');
  if(bgBox){bgBox.addEventListener('click',e=>{if(e.target.id==='bgImgInput')return;if(e.target.closest('[data-rm-bg]')){store.theme.bgImg='';applyTheme();save();renderThemePanel();toast('已移除背景照片');return}const input=$('#bgImgInput');if(input)input.click()});
    const bgInput=$('#bgImgInput');
    if(bgInput)bgInput.addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];handleBgFile(file);e.target.value=''});
  }
  const rBg=$('#rBgOp');if(rBg)rBg.addEventListener('input',e=>{store.theme.bgImgOpacity=Number(e.target.value);const v=$('#bgOpVal');if(v)v.textContent=store.theme.bgImgOpacity+'%';applyTheme();save()});
  const rR=$('#rRadius');if(rR)rR.addEventListener('input',e=>{store.theme.radius=Number(e.target.value);$('#radVal').textContent=store.theme.radius+'px';applyTheme();save()});
  const rS=$('#rShadow');if(rS)rS.addEventListener('input',e=>{store.theme.shadow=Number(e.target.value);$('#shVal').textContent=store.theme.shadow.toFixed(1);applyTheme();save()});
  $$('#fontSeg button').forEach(b=>{b.onclick=()=>{store.theme.font=b.dataset.font;$$('#fontSeg button').forEach(x=>x.classList.toggle('on',x===b));applyTheme();save()}});
  const sw=$('#swDeco');if(sw)sw.onclick=()=>{store.theme.deco=!store.theme.deco;sw.classList.toggle('on',store.theme.deco);applyTheme();save()};
  const rs=$('#resetTheme');if(rs)rs.onclick=()=>{store.theme={...DEFAULT_THEME};applyTheme();save();renderThemePanel();toast('已恢复可爱风 🎀')};
  const ct=$('#closeTheme');if(ct)ct.onclick=closeAllPanels;
}
async function handleBgFile(file){
  if(!file)return;
  try{toast('正在处理背景照片…');const data=await fileToCompressedDataURL(file,1200,0.72);store.theme.bgImg=data;if(store.theme.bgImgOpacity==null)store.theme.bgImgOpacity=100;applyTheme();save();renderThemePanel();toast('背景已更新 🖼️')}
  catch(err){console.warn(err);toast('这张图片读不出来，换一张试试 🥲')}
}

const EMOJIS=['🍲','🍛','🍜','🍝','🥘','🍗','🍖','🥩','🐟','🍤','🥟','🍚','🍙','🍞','🥗','🥦','🍅','🌽','🥕','🍆','🍄','🍮','🍰','🍉','🍋','🧋','🥛','🍳'];
let pickedEmoji='🍲',pickedCat='家常菜',pendingImg=null,editingId=null;

function renderImgPreview(){
  const box=$('#imgPreview');
  if(pendingImg)box.innerHTML=`<img class="up-img" src="${pendingImg}" alt=""><button class="rm" data-rm title="移除照片">✕</button>`;
  else box.innerHTML=`<div class="ph">📷 点击上传菜品照片<small>可选 · 不上传就用下方的图标</small></div>`;
}
function openAddSheet(dish){
  editingId=dish?dish.id:null;pickedEmoji=dish?dish.emoji:'🍲';pickedCat=dish?dish.cat:'家常菜';pendingImg=dish?(dish.img||null):null;
  $('#addSheetTitle').textContent=dish?'✏️ 编辑菜品':'➕ 添加一道菜';
  $('#saveDish').textContent=dish?'保存修改':'加入菜单';
  $('#deleteDish').style.display=dish?'block':'none';
  $('#newName').value=dish?dish.name:'';
  $('#emojiPick').innerHTML=EMOJIS.map(e=>`<span data-emoji="${e}" class="${e===pickedEmoji?'on':''}">${e}</span>`).join('');
  $$('#newCatSeg button').forEach(b=>b.classList.toggle('on',b.dataset.cat===pickedCat));
  renderImgPreview();openSheet($('#addSheet'));
  setTimeout(()=>{if(!dish)$('#newName').focus()},320);
}
async function handleImageFile(file){
  if(!file)return;
  try{toast('正在处理照片…');const data=await fileToCompressedDataURL(file);pendingImg=data;renderImgPreview();toast('照片已添加 📷')}
  catch(err){console.warn(err);toast('这张图片读不出来，换一张试试 🥲')}
}
function saveNewDish(){
  const name=$('#newName').value.trim();
  if(!name){toast('先给它起个名字吧 ✏️');return}
  if(editingId){
    const d=getDish(editingId);if(!d)return;
    d.name=name;d.cat=pickedCat;d.emoji=pickedEmoji;d.img=pendingImg||undefined;
    save();closeAllPanels();renderAll();toast('已保存修改 ✅');
  }else{
    store.dishes.push({id:'u'+Date.now(),name,cat:pickedCat,emoji:pickedEmoji,time:20,img:pendingImg||undefined});
    save();closeAllPanels();renderDishes();toast('已加入菜单 🎉');
  }
}
function deleteDishFromMenu(){if(!editingId)return;const id=editingId;if(confirmDeleteDish(id))closeAllPanels()}

function randomPick(){
  const pool=store.dishes.slice();if(!pool.length)return;
  const picked=[];const n=Math.min(3,pool.length);
  for(let i=0;i<n;i++){const idx=Math.floor(Math.random()*pool.length);picked.push(pool.splice(idx,1)[0])}
  picked.forEach(d=>{const it=cartItem(d.id);if(it)it.count++;else store.cart.push({id:d.id,count:1,note:''})});
  save();renderDishes();renderCartBar();renderCartSheet();
  toast(`随机给你挑了：${picked.map(d=>d.name).join('、')} 🎲`);
}

let pressTimer=null,longPressed=false,pressStart=null;
function clearPress(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null}pressStart=null}

function setupKeyboardFix(){
  if(!window.visualViewport)return;
  const vv=window.visualViewport,r=document.documentElement;let raf=null;
  function update(){if(raf)return;raf=requestAnimationFrame(()=>{raf=null;const vh=window.innerHeight,vvH=vv.height,kb=Math.max(0,vh-vvH);r.style.setProperty('--kb',kb>100?kb+'px':'0px')})}
  vv.addEventListener('resize',update);vv.addEventListener('scroll',update);update();
}

function bindEvents(){
  $('#themeBtn').onclick=()=>{renderThemePanel();$('#drawer').classList.add('show');$('#mask').classList.add('show');lockBody()};
  $('#tabbar').addEventListener('click',e=>{const btn=e.target.closest('button[data-view]');if(btn)switchView(btn.dataset.view)});

  $('#cats').addEventListener('click',e=>{
    if(e.target.closest('#randomBtn')){randomPick();return}
    const chip=e.target.closest('.cat-chip[data-cat]');if(!chip)return;
    store.activeCat=chip.dataset.cat;save();renderCats();renderDishes();
  });

  const grid=$('#dishGrid');
  grid.addEventListener('click',e=>{
    if(longPressed){longPressed=false;return}
    const del=e.target.closest('.dish-del');
    if(del){e.stopPropagation();confirmDeleteDish(del.dataset.delDish);return}
    if(e.target.closest('#addDishBtn')){openAddSheet(null);return}
    const card=e.target.closest('.dish[data-id]');if(!card)return;
    const d=getDish(card.dataset.id);if(!d)return;
    if(d.img)openDishLightbox(d.id);else addDish(d.id);
  });
  grid.addEventListener('pointerdown',e=>{
    if(e.target.closest('.dish-del')||e.target.closest('#addDishBtn'))return;
    const card=e.target.closest('.dish[data-id]');if(!card)return;
    longPressed=false;pressStart={x:e.clientX,y:e.clientY};clearPress();
    pressTimer=setTimeout(()=>{pressTimer=null;longPressed=true;if(navigator.vibrate)navigator.vibrate(18);const d=getDish(card.dataset.id);if(d)openAddSheet(d)},600);
  });
  grid.addEventListener('pointermove',e=>{if(!pressStart||!pressTimer)return;const dx=Math.abs(e.clientX-pressStart.x),dy=Math.abs(e.clientY-pressStart.y);if(dx>10||dy>10)clearPress()});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>grid.addEventListener(ev,clearPress));
  window.addEventListener('scroll',clearPress,{passive:true});
  grid.addEventListener('contextmenu',e=>{const card=e.target.closest('.dish[data-id]');if(!card)return;e.preventDefault();const d=getDish(card.dataset.id);if(d)openAddSheet(d)});

  $('#cartBar').addEventListener('click',e=>{if(e.target.closest('#openCart')){renderCartSheet();openSheet($('#cartSheet'))}});

  $('#cartList').addEventListener('click',e=>{
    const look=e.target.closest('.ci-thumb[data-look]');
    if(look){openDishLightbox(look.dataset.dish);return}
    const inc=e.target.closest('[data-inc]'),dec=e.target.closest('[data-dec]');
    if(inc)changeCount(inc.dataset.inc,+1);
    if(dec)changeCount(dec.dataset.dec,-1);
  });
  $('#cartList').addEventListener('input',e=>{const n=e.target.closest('[data-note]');if(!n)return;const it=cartItem(n.dataset.note);if(it){it.note=n.value;save()}});
  $('#submitOrder').onclick=submitOrder;

  $('#kitchenBox').addEventListener('click',e=>{
    const look=e.target.closest('.ci-thumb[data-look]');
    if(look){const o=store.orders.find(x=>x.id===Number(look.dataset.oid));if(o){const it=o.items[Number(look.dataset.idx)];if(it&&it.img)showLightbox(it.img,it.name,`厨房菜单 · ${fmtTime(o.createdAt)}`,null)}return}
    const finish=e.target.closest('[data-finish]');if(finish){finishOrder(finish.dataset.finish);return}
    const item=e.target.closest('.check-item');if(item)toggleCheck(item.dataset.oid,Number(item.dataset.idx));
  });

  $('#historyBox').addEventListener('click',e=>{
    const look=e.target.closest('.hi-thumb[data-look]');
    if(look){const o=store.orders.find(x=>x.id===Number(look.dataset.oid));if(o){const it=o.items[Number(look.dataset.idx)];if(it&&it.img)showLightbox(it.img,it.name,`吃饭记录 · ${fmtTime(o.createdAt)}`,null)}return}
    const del=e.target.closest('[data-del]');if(del){deleteHistory(del.dataset.del);return}
    const again=e.target.closest('[data-again]');if(!again)return;
    const o=store.orders.find(x=>x.id===Number(again.dataset.again));if(!o)return;
    o.items.forEach(it=>{const d=store.dishes.find(x=>x.name===it.name);if(!d)return;const c=cartItem(d.id);if(c)c.count+=it.count;else store.cart.push({id:d.id,count:it.count,note:it.note||''})});
    save();renderDishes();renderCartBar();renderCartSheet();switchView('order');toast('已放回点菜清单 🧺');
  });

  $('#lbClose').onclick=closeLightbox;
  $('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))closeLightbox()});
  $('#lbAdd').onclick=()=>{if(!lbDishId)return;addDish(lbDishId);closeLightbox();toast('已加入清单 🧺')};

  $('#mask').onclick=closeAllPanels;
  document.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeAllPanels()});

  $('#newCatSeg').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(!b)return;pickedCat=b.dataset.cat;$$('#newCatSeg button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#emojiPick').addEventListener('click',e=>{const s=e.target.closest('[data-emoji]');if(!s)return;pickedEmoji=s.dataset.emoji;$$('#emojiPick span').forEach(x=>x.classList.toggle('on',x===s))});

  $('#uploadBox').addEventListener('click',e=>{
    if(e.target.id==='imgInput')return;
    if(e.target.closest('[data-rm]')){pendingImg=null;renderImgPreview();toast('已移除照片');return}
    const input=$('#imgInput');if(input)input.click();
  });
  $('#imgInput').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];handleImageFile(file);e.target.value=''});

  $('#saveDish').onclick=saveNewDish;
  $('#deleteDish').onclick=deleteDishFromMenu;
  $('#newName').addEventListener('keydown',e=>{if(e.key==='Enter')saveNewDish()});

  document.addEventListener('focusin',e=>{
    const el=e.target;if(!el||!/^(INPUT|TEXTAREA)$/.test(el.tagName))return;
    const sheet=el.closest('.sheet');if(!sheet)return;
    setTimeout(()=>{try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(err){try{el.scrollIntoView()}catch(_){}}},320);
  });

  document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#lightbox').classList.contains('show')){closeLightbox();return}closeAllPanels()});
}

function init(){load();applyTheme();bindEvents();setupKeyboardFix();renderAll();switchView('order')}
init();
</script>
</body>
</html>
